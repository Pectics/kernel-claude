# Test configuration for SQLite
spring:
  datasource:
    url: jdbc:sqlite:F:/kernel-claude/.db/db.test.sqlite
    driver-class-name: org.sqlite.JDBC
    # SQLite doesn't need username/password
    username:
    password:

  # Disable HikariCP validation for SQLite
  datasource.hikari:
    connection-test-query: SELECT 1
    maximum-pool-size: 1

# MyBatis configuration
mybatis:
  configuration:
    default-executor-type: simple
    map-underscore-to-camel-case: true

# Kernel Claude data configuration
kernel-claude:
  data:
    table-prefix: "kc_"
    auto-initialize-schema: true
    thread-pool-size: 2
